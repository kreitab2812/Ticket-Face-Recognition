name: Docker Build & Push

on:
  push:
    branches: [ "main" ]
    # Chi build khi cac file loi thay doi de tiet kiem thoi gian
    paths:
      - 'backend/**'
      - 'frontend-admin/**'
      - 'frontend-kiosk/**'
      - 'nginx/**'
      - 'docker-compose.yml'

jobs:
  build-images:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        # Doi thanh true neu cau muon day image len DockerHub
        push: false 
        tags: btl-face-rec-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build AI Worker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/worker/Dockerfile
        push: false
        tags: btl-face-rec-worker:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend Admin Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend-admin
        push: false
        tags: btl-face-rec-admin:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend Kiosk Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend-kiosk
        push: false
        tags: btl-face-rec-kiosk:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
