name: CI & Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    # Đưa toàn bộ các dependencies (DB, MQ, Storage) vào block services
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: event_checkin
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: adminpassword
        ports:
          - "5672:5672"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - "9000:9000"
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install system dependencies for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
          
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "numpy<2" "opencv-python<4.11" "tensorflow==2.16.1" "tf-keras==2.16.0" "httpx<0.28.0" pytest
          
      - name: Setup MinIO Buckets and Local Hosts
        run: |
          # Sử dụng MinIO Client (mc) để tạo các bucket tự động thay vì dùng docker exec
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin
          ./mc mb myminio/event-logs
          ./mc mb myminio/avatars
          
          # Map host cho local runner để pass các test
          echo "127.0.0.1 minio rabbitmq" | sudo tee -a /etc/hosts
          
      - name: Run Pytest
        env:
          DATABASE_URL: "postgresql://admin:adminpassword@localhost:5432/event_checkin"
          TF_USE_LEGACY_KERAS: "1"
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin"
          RABBITMQ_USER: "admin"
          RABBITMQ_PASSWORD: "adminpassword"
        run: |
          cd backend
          python -m pytest tests/
          
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Test Admin
        run: |
          cd frontend-admin
          npm install --legacy-peer-deps
          npm run test
          
      - name: Test Kiosk
        run: |
          cd frontend-kiosk
          npm install --legacy-peer-deps
          npm run test

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/btl-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/btl-backend:latest
          
      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/btl-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/btl-admin:latest
          
      - name: Build and push Kiosk
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-kiosk
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/btl-kiosk:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/btl-kiosk:latest
