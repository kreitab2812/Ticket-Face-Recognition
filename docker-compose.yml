services:
  # ==========================================
  # 1. HA TANG CO SO DU LIEU & MESSAGE QUEUE
  # ==========================================
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./pg_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    volumes:
      - ./qdrant_data:/qdrant/storage:z
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    environment:
      - RABBITMQ_DEFAULT_USER=${MQ_USER}
      - RABBITMQ_DEFAULT_PASS=${MQ_PASSWORD}
    command: bash -c "rabbitmq-plugins enable rabbitmq_prometheus; rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio_storage
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    ports:
      - "9005:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data:z
    restart: unless-stopped

  # ==========================================
  # 2. KHOI LOGIC NGHIEP VU (BACKEND & WORKER)
  # ==========================================
  backend_api:
    build: ./backend
    container_name: backend_api
    env_file: 
      - .env
    ports:
      - "8000:8000"  # [FIX]: Cổng này giúp cậu vào được /docs để test
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend/temp_images:/code/temp_images:z
      - deepface_models:/root/.deepface:z
    restart: unless-stopped

  ai_worker:
    build: ./worker
    container_name: ai_worker
    env_file: 
      - .env
    command: python -u worker.py 
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend/temp_images:/code/temp_images:z
      - deepface_models:/root/.deepface:z
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    restart: unless-stopped
    
  cleanup_worker:
    build: ./worker  # [FIX]: Đổi từ ./backend sang ./worker cho chuẩn cấu trúc mới
    container_name: cleanup_worker
    command: python -m tasks.cleanup_task
    volumes:
      - ./backend/temp_images:/code/temp_images:z
    restart: unless-stopped

  # ==========================================
  # 3. KHOI GIAO DIEN (REACTJS)
  # ==========================================
  frontend_kiosk:
    build: ./frontend-kiosk
    container_name: frontend_kiosk
    restart: unless-stopped

  frontend_admin:
    build: ./frontend-admin
    container_name: frontend_admin
    restart: unless-stopped

  # ==========================================
  # 4. BO DIEU PHOI (API GATEWAY)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
    ports:
      - "4000:80"       
      - "5000:8080"     
    depends_on:
      - backend_api
      - frontend_kiosk
      - frontend_admin
    restart: unless-stopped
    
  # ==========================================
  # 5. HE THONG GIAM SAT (MONITORING)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus_data:/prometheus:z
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-adminpassword}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  deepface_models:
