services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage:z
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: access_control
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data:z
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_queue
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data:z
    restart: unless-stopped

  backend_api:
    build: ./backend
    container_name: backend_api
    ports:
      - "8000:8000" # Giữ lại để App Desktop test nội bộ
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - qdrant
      - rabbitmq
    volumes:
      - ./backend/temp_images:/app/temp_images:z
      - ~/.deepface:/root/.deepface:z
    restart: unless-stopped

  ai_worker:
    build: ./backend
    container_name: ai_worker
    command: python worker.py
    depends_on:
      - qdrant
      - rabbitmq
    volumes:
      - ./backend/temp_images:/app/temp_images:z
      - ~/.deepface:/root/.deepface:z
    restart: unless-stopped

  frontend_web:
    build: ./frontend_web
    container_name: frontend_web
    restart: unless-stopped
    # Không expose port ra ngoài nữa, để Nginx lo!

  # LOAD BALANCER NGINX (MỚI)
  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80" # Truy cập hệ thống thẳng qua http://127.0.0.1 (không cần port 8080)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_api
      - frontend_web
    restart: unless-stopped
