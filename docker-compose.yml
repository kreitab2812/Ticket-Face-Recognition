services:
  # 1. Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage:z
    restart: unless-stopped

  # 2. Relational Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: access_control
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data:z
    restart: unless-stopped

  # 3. Message Queue (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_queue
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - "5672:5672"   # Port giao tiếp API
      - "15672:15672" # Port UI quản lý trên trình duyệt
    restart: unless-stopped

  # 4. Object Storage (MinIO)
  minio:
    image: minio/minio
    container_name: minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000" # Port API
      - "9001:9001" # Port UI quản lý trên trình duyệt
    volumes:
      - ./minio_data:/data:z
    restart: unless-stopped

  # 5. Backend API (FastAPI)
  backend_api:
    build: ./backend
    container_name: backend_api
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - qdrant
      - rabbitmq
    volumes:
      - ./backend/temp_images:/app/temp_images:z
      - ~/.deepface:/root/.deepface:z
    restart: unless-stopped

  # 6. AI Worker (Chạy ngầm xử lý Queue)
  ai_worker:
    build: ./backend
    container_name: ai_worker
    command: python worker.py
    depends_on:
      - qdrant
      - rabbitmq
    volumes:
      - ./backend/temp_images:/app/temp_images:z
      - ~/.deepface:/root/.deepface:z
    restart: unless-stopped

  # 7. Frontend Web (Nginx)
  frontend_web:
    build: ./frontend
    container_name: frontend_web
    ports:
      - "8080:80"  # Đổi chỗ này: Ánh xạ cổng 80 của container ra cổng 8080 của máy tính
    restart: unless-stopped
