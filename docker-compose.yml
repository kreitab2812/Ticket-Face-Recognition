version: '3.8' # Nên có version để chạy ổn định trên các máy khác nhau

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage:z
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adminpassword}
      POSTGRES_DB: ${DB_NAME:-event_checkin} # Đã đổi tên DB cho hợp sự kiện
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data:z
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_queue
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:-adminpassword}
    ports:
      - "5672:5672"
      - "15672:15672" # Trang quản trị RabbitMQ (http://localhost:15672)
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-adminpassword}
    ports:
      - "9000:9000"
      - "9001:9001" # Trang quản trị MinIO (http://localhost:9001)
    volumes:
      - ./minio_data:/data:z
    restart: unless-stopped

  backend_api:
    build: ./backend
    container_name: backend_api
    env_file: 
      - .env # Load biến môi trường vào Backend
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - qdrant
      - rabbitmq
      - minio
    volumes:
      - ./backend/temp_images:/app/temp_images:z
      - ~/.deepface:/root/.deepface:z # Cache model AI để ko phải tải lại
    restart: unless-stopped

  ai_worker:
    build: ./backend
    container_name: ai_worker
    env_file: 
      - .env # Worker cũng cần biến môi trường
    command: python worker.py
    depends_on:
      - qdrant
      - rabbitmq
    volumes:
      - ./backend/temp_images:/app/temp_images:z
      - ~/.deepface:/root/.deepface:z
    restart: unless-stopped

  frontend_web:
    build: ./frontend_web
    container_name: frontend_web
    restart: unless-stopped

  # LOAD BALANCER NGINX
  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_api
      - frontend_web
    restart: unless-stopped
