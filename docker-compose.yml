services:
  # ==========================================
  # 1. HA TANG CO SO DU LIEU & MESSAGE QUEUE
  # ==========================================
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
      - POSTGRES_DB=event_checkin
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio_storage
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=adminpassword
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  # ==========================================
  # 2. KHOI LOGIC NGHIEP VU (BACKEND & WORKER)
  # ==========================================
  backend_api:
    build: ./backend
    container_name: backend_api
    env_file: 
      - .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - qdrant
      - rabbitmq
      - minio
    volumes:
      - ./backend/temp_images:/code/temp_images
      - ~/.deepface:/root/.deepface
    restart: unless-stopped

  ai_worker:
    build: ./backend
    container_name: ai_worker
    env_file: 
      - .env
    command: python -m worker.task_embedding
    depends_on:
      - qdrant
      - rabbitmq
    volumes:
      - ./backend/temp_images:/code/temp_images
      - ~/.deepface:/root/.deepface
    restart: unless-stopped
    
  cleanup_worker:
    build: ./backend
    container_name: cleanup_worker
    command: python -m worker.tasks.cleanup_task
    volumes:
      - ./backend/temp_images:/code/temp_images
    restart: unless-stopped

  # ==========================================
  # 3. KHOI GIAO DIEN (REACTJS)
  # ==========================================
  frontend_kiosk:
    build: ./frontend-kiosk
    container_name: frontend_kiosk
    restart: unless-stopped

  frontend_admin:
    build: ./frontend-admin
    container_name: frontend_admin
    restart: unless-stopped

  # ==========================================
  # 4. BO DIEU PHOI (API GATEWAY)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "4000:80"       # Cong Kiosk lach luat quyen root
      - "5000:8080"     # Cong Admin
    depends_on:
      - backend_api
      - frontend_kiosk
      - frontend_admin
    restart: unless-stopped
