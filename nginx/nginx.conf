events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # 1. Server cho Kiosk Check-in (Khách hàng truy cập)
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://frontend_kiosk:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend_api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # 2. Server cho Admin Portal (Ban tổ chức truy cập)
    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://frontend_admin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend_api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
