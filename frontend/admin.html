<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HR Management</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen hidden" id="mainBody">
    
    <div class="navbar bg-primary text-primary-content shadow-lg">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost normal-case text-xl">⬅ Kiosk Chấm Công</a>
            <span class="ml-4 font-bold text-xl">| HR Dashboard</span>
        </div>
    </div>

    <div class="p-8 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="space-y-8">
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h2 class="card-title text-2xl mb-4">Thêm Nhân Viên Mới</h2>
                    <form id="addEmployeeForm" class="space-y-4">
<div class="card bg-base-100 shadow-xl">
    <div class="card-body">
        <h2 class="card-title text-2xl mb-4">Thêm Nhân Viên Mới</h2>
        <video id="webcamAdmin" class="hidden"></video> <form id="addEmployeeForm" class="space-y-4">
            <div class="form-control">
                <label class="label"><span class="label-text font-medium">Họ và Tên</span></label>
                <input type="text" id="empName" placeholder="VD: Đinh Mạnh Cường" class="input input-bordered w-full" required />
            </div>
            
            <div class="flex gap-2">
                <input type="file" id="empImage" accept="image/*" class="file-input file-input-bordered flex-1" />
                <button type="button" class="btn btn-secondary" onclick="captureAndSubmit()">📸 Quét Tại Chỗ</button>
            </div>
            
            <button type="submit" class="btn btn-primary w-full" id="submitBtn">Đăng ký khuôn mặt</button>
        </form>
    </div>
</div>
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h2 class="card-title text-xl mb-4">Danh Sách Nhân Sự</h2>
                    <div class="overflow-x-auto">
                        <table class="table table-zebra w-full">
                            <thead><tr><th>ID</th><th>Họ Tên</th><th>Trạng Thái</th></tr></thead>
                            <tbody id="employeeTable">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 card bg-base-100 shadow-xl">
            <div class="card-body">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="card-title text-2xl">Nhật Ký Chấm Công Hôm Nay</h2>
                    <button onclick="loadLogs()" class="btn btn-sm btn-outline">🔄 Làm mới</button>
                </div>
                <div class="overflow-x-auto h-[600px]">
                    <table class="table table-pin-rows w-full">
                        <thead>
                            <tr class="bg-base-200">
                                <th>Thời gian</th>
                                <th>Nhân viên</th>
                                <th>Hành động</th>
                                <th>Đánh giá</th>
                                <th>Bằng chứng (MinIO)</th>
                            </tr>
                        </thead>
                        <tbody id="logsTable">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Bảo mật cơ bản: Chặn màn hình bằng mật khẩu
        window.onload = () => {
            const pwd = prompt("Yêu cầu mã xác thực quản trị viên (Gợi ý: adminpassword):");
            if (pwd === "adminpassword") {
                document.getElementById('mainBody').classList.remove('hidden');
                loadEmployees();
                loadLogs();
            } else {
                alert("Sai mật khẩu! Đang quay lại Kiosk.");
                window.location.href = "index.html";
            }
        }

        const API_BASE = "http://127.0.0.1:8000";

        // Load danh sách nhân viên
        async function loadEmployees() {
            try {
                const res = await fetch(`${API_BASE}/admin/employees`);
                const data = await res.json();
                let html = '';
                data.forEach(emp => {
                    html += `<tr><td>#${emp.id}</td><td class="font-bold">${emp.name}</td><td><div class="badge badge-success gap-2">${emp.status}</div></td></tr>`;
                });
                document.getElementById('employeeTable').innerHTML = html;
            } catch (err) { console.error(err); }
        }

        // Load nhật ký chấm công
        async function loadLogs() {
            try {
                const res = await fetch(`${API_BASE}/admin/logs`);
                const data = await res.json();
                let html = '';
                data.forEach(log => {
                    const statusBadge = log.status === "Đúng giờ" ? "badge-success" : (log.status === "Đi muộn" ? "badge-warning" : "badge-error");
                    const actionBadge = log.action_type === "CHECK-IN" ? "badge-info" : "badge-neutral";
                    
                    html += `
                        <tr class="hover">
                            <td class="font-mono">${log.check_time}</td>
                            <td class="font-bold">${log.employee_name}</td>
                            <td><span class="badge ${actionBadge}">${log.action_type}</span></td>
                            <td><span class="badge ${statusBadge} text-white">${log.status}</span></td>
                            <td><a href="${log.image_url}" target="_blank" class="btn btn-xs btn-outline">Xem ảnh</a></td>
                        </tr>
                    `;
                });
                document.getElementById('logsTable').innerHTML = html;
            } catch (err) { console.error(err); }
        }

        // Xử lý Form thêm nhân viên
        document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<span class="loading loading-spinner"></span> Đang xử lý...`;
            btn.disabled = true;

            const formData = new FormData();
            formData.append('name', document.getElementById('empName').value);
            formData.append('file', document.getElementById('empImage').files[0]);

            try {
                const response = await fetch(`${API_BASE}/admin/add_employee`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    alert("Thêm nhân viên thành công!");
                    document.getElementById('addEmployeeForm').reset();
                    loadEmployees(); // Cập nhật lại bảng
                } else {
                    alert("Lỗi: " + result.message);
                }
            } catch (error) {
                alert("Không thể kết nối đến máy chủ.");
            } finally {
                btn.innerHTML = `Đăng ký khuôn mặt`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
